name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build --workspace @chicks-cannon/web
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
      - name: Add Static Web Apps configuration to the bundle
        run: cp apps/web/staticwebapp.config.json apps/web/dist/staticwebapp.config.json
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
